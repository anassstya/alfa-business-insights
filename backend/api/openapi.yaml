openapi: 3.0.3
info:
  title: Alfa Business Insights API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Go backend
paths:
  /api/v1/roles:
    get:
      tags:
        - Roles
      summary: Получить список ролей
      description: Возвращает все доступные роли для персонализации аналитики
      operationId: getRoles
      responses:
        '200':
          description: Список ролей успешно получен
          content:
            application/json:
              schema:
                type: object
                required:
                  - roles
                properties:
                  roles:
                    type: array
                    items:
                      type: object
                      required:
                        - code
                        - full_name
                      properties:
                        code:
                          type: string
                          example: cfo
                        full_name:
                          type: string
                          example: Финансовый директор
              example:
                roles:
                  - code: ceo
                    full_name: Генеральный директор
                  - code: cfo
                    full_name: Финансовый директор
  /api/v1/demo/users:
    get:
      tags:
        - Demo Users
      summary: Получить список демопользователей
      description: Возвращает список тестовых пользователей для выбора профиля при входе в приложение
      operationId: getDemoUsers
      responses:
        '200':
          description: Список демопользователей успешно получен
          content:
            application/json:
              schema:
                type: object
                required:
                  - users
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - synthetic_f
                        - first_name
                        - last_name
                      properties:
                        id:
                          type: integer
                          format: int64
                          example: 1
                        synthetic_f:
                          type: string
                          example: F_25503
                        first_name:
                          type: string
                          example: Александр
                        last_name:
                          type: string
                          example: Иванов
              example:
                users:
                  - id: 1
                    synthetic_f: F_25503
                    first_name: Александр
                    last_name: Иванов
                  - id: 2
                    synthetic_f: F_93095
                    first_name: Мария
                    last_name: Петрова
                  - id: 3
                    synthetic_f: F_11036
                    first_name: Дмитрий
                    last_name: Сидоров
  /api/v1/demo/users/{id}/companies:
    get:
      tags:
        - Companies
      summary: Получить компании пользователя
      description: Возвращает компании выбранного демопользователя, у которых cl_type=CLIENT, выручка заполнена и не равна 1000, а суммарная выручка группы (group_id) по всей таблице companies превышает 15 млрд. Наличие подготовленного ML-профиля этим не гарантируется.
      operationId: getDemoUserCompanies
      parameters:
        - name: id
          in: path
          required: true
          description: ID демопользователя
          schema:
            type: integer
            format: int64
            minimum: 1
          example: 1
      responses:
        '200':
          description: Список компаний успешно получен
          content:
            application/json:
              schema:
                type: object
                required:
                  - companies
                properties:
                  companies:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - synthetic_u
                      properties:
                        id:
                          type: integer
                          format: int64
                          description: Уникальный ID компании
                        synthetic_u:
                          type: string
                          description: Синтетический идентификатор компании
                        city:
                          type: string
                          nullable: true
                          description: Город
                        region:
                          type: string
                          nullable: true
                          description: Регион
                        revenue_company:
                          type: number
                          nullable: true
                          description: Годовая выручка компании
                        mainokved_name:
                          type: string
                          nullable: true
                          description: Наименование основного вида экономической деятельности
                        mainokved_code:
                          type: string
                          nullable: true
                          description: Код основного вида экономической деятельности
                        org_type:
                          type: string
                          nullable: true
                          description: Тип организации
                        okfs_name:
                          type: string
                          nullable: true
                          description: Форма собственности
                        company_age_years_gradation:
                          type: string
                          nullable: true
                          description: Возраст компании (категория)
                        eco_mark_label:
                          type: string
                          nullable: true
                          description: Экологическая маркировка компании
                        amount_workers_fns_gradation:
                          type: string
                          nullable: true
                          description: Категория численности сотрудников по данным ФНС
                        cl_type:
                          type: string
                          enum:
                            - CLIENT
                          description: Статус компании — действующий клиент
              example:
                companies:
                  - id: 31259
                    synthetic_u: U_136101
                    cl_type: CLIENT
        '400':
          description: Некорректный ID пользователя
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: Пользователь не найден
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка сервера
          content:
            text/plain:
              schema:
                type: string
  /api/v1/companies:
    get:
      tags:
        - Companies
      summary: Получить компании, доступные по финансовым фильтрам
      description: Возвращает компании с cl_type=CLIENT, заполненной выручкой, отличной от заглушки 1000, и group_id с суммарной выручкой группы более 15 млрд (сумма по всей таблице companies). Пагинация после фильтрации. Наличие ML-профиля не гарантируется.
      operationId: getCompanies
      parameters:
        - name: limit
          in: query
          required: false
          description: Максимальное количество компаний в ответе
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          required: false
          description: Количество пропускаемых компаний
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Список компаний успешно получен
          content:
            application/json:
              schema:
                type: object
                required:
                  - companies
                  - total
                  - limit
                  - offset
                properties:
                  companies:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - synthetic_u
                      properties:
                        id:
                          type: integer
                          format: int64
                        synthetic_u:
                          type: string
                        city:
                          type: string
                          nullable: true
                        region:
                          type: string
                          nullable: true
                        revenue_company:
                          type: number
                          nullable: true
                        mainokved_name:
                          type: string
                          nullable: true
                        mainokved_code:
                          type: string
                          nullable: true
                        org_type:
                          type: string
                          nullable: true
                        okfs_name:
                          type: string
                          nullable: true
                        company_age_years_gradation:
                          type: string
                          nullable: true
                        eco_mark_label:
                          type: string
                          nullable: true
                        amount_workers_fns_gradation:
                          type: string
                          nullable: true
                        cl_type:
                          type: string
                          enum:
                            - CLIENT
                  total:
                    type: integer
                    format: int64
                    description: Общее количество компаний, прошедших фильтры клиента, выручки и группы
                  limit:
                    type: integer
                    description: Размер страницы
                  offset:
                    type: integer
                    description: Смещение от начала списка
        '400':
          description: Некорректные параметры пагинации
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Внутренняя ошибка сервера
          content:
            text/plain:
              schema:
                type: string
  /api/v1/companies/{companyID}:
    get:
      tags:
        - Companies
      summary: Получить компанию по ID
      description: 'Возвращает информацию о компании по ее числовому ID. Доступны только компании со статусом CLIENT.

        '
      operationId: getCompanyByID
      parameters:
        - name: companyID
          in: path
          required: true
          description: Числовой ID компании из таблицы companies
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Информация о компании
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - synthetic_u
                  - cl_type
                properties:
                  id:
                    type: integer
                    format: int64
                  synthetic_u:
                    type: string
                  city:
                    type: string
                    nullable: true
                  region:
                    type: string
                    nullable: true
                  revenue_company:
                    type: number
                    nullable: true
                  mainokved_name:
                    type: string
                    nullable: true
                  mainokved_code:
                    type: string
                    nullable: true
                  org_type:
                    type: string
                    nullable: true
                  okfs_name:
                    type: string
                    nullable: true
                  company_age_years_gradation:
                    type: string
                    nullable: true
                  eco_mark_label:
                    type: string
                    nullable: true
                  amount_workers_fns_gradation:
                    type: string
                    nullable: true
                  cl_type:
                    type: string
                    enum:
                      - CLIENT
              example:
                id: 123
                synthetic_u: U_12345
                city: Краснодар
                region: Краснодарский край
                revenue_company: 150000000
                mainokved_name: Аренда недвижимого имущества
                mainokved_code: '68.20'
                org_type: ООО
                okfs_name: Частная собственность
                company_age_years_gradation: 5-10 лет
                eco_mark_label: null
                amount_workers_fns_gradation: 10-50
                cl_type: CLIENT
        '400':
          description: Некорректный ID компании
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Компания не найдена или недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/companies/{companyID}/analysis:
    post:
      tags:
        - Analysis
      summary: Запустить анализ компании
      description: 'Создаёт задачу анализа компании и запускает ML в фоне.
       Сразу возвращает job_id. Прогресс и результат доступны
       через GET /api/v1/analysis/jobs/{jobID} и SSE.'
      parameters:
        - name: companyID
          in: path
          required: true
          description: Уникальный числовой ID компании из таблицы companies
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        description: Данные для запуска анализа компании
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAnalysisRequest'
      responses:
        '202':
          description: Задание создано (pending), ML будет вызван в фоне.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAnalysisResponse'
        '400':
          description: Некорректный ID компании, ID демопользователя или роль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Компания не найдена, не CLIENT или не связана с переданным demo_user_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      operationId: startAnalysis
  /api/v1/demo/users/{id}/analysis/jobs:
    get:
      tags:
        - Analysis
      summary: Получить историю анализов демопользователя
      description: Возвращает задачи выбранного demo_user_id в обратном хронологическом порядке. Задания без demo_user_id
        исключаются. Текущая версия не проверяет наличие самого демопользователя и при неизвестном ID возвращает
        пустой массив.
      operationId: getDemoUserAnalysisJobs
      parameters:
        - name: id
          in: path
          required: true
          description: ID демопользователя
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: История анализов пользователя
          content:
            application/json:
              schema:
                type: object
                required:
                  - jobs
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnalysisJobSummary'
        '400':
          description: Некорректный ID пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/analysis/jobs/{jobID}:
    get:
      tags:
        - Analysis
      summary: Получить анализ по ID
      description: Возвращает задачу, статус, этап, возможную ошибку и весь AnalysisResult в поле result. Во время
        pending/running result обычно null. В текущей демоверсии авторизация доступа к job_id ещё не реализована.
      operationId: getAnalysisJobByID
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Информация о задаче анализа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '400':
          description: Некорректный job_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Задача анализа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/analysis/jobs/{jobID}/events:
    get:
      tags:
        - Analysis
      summary: Получать обновления анализа через SSE
      description: 'SSE-поток Go: сразу отправляет event: update с JSON AnalysisJob, затем новые update при изменении
        записи (проверка PostgreSQL примерно каждые 2 секунды). Комментарий : ping каждые 20 секунд. Это не прямые
        StageEvent из ML. Соединение пока не закрывается автоматически после completed/failed. В текущей демоверсии
        авторизация job_id не реализована.'
      operationId: streamAnalysisEvents
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: Поток событий анализа
          content:
            text/event-stream:
              schema:
                type: string
              example: 'event: update

                data: {"job_id":"3fa85f64-5717-4562-b3fc-2c963f66afa6","status":"running","stage":"retrieving"}


                '
        '400':
          description: Некорректный job_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Задача анализа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/internal/analysis/events:
    post:
      tags:
        - Internal ML
      summary: Получить обновление анализа от ML
      description: 'Сервисный callback от ML; требует Authorization: Bearer <ML_CALLBACK_TOKEN>. Созданное Go задание
        обновляется по job_id. Прогресс: running+stage; финал: completed/failed и result/error_message. Результат
        сохраняется в analysis_jobs.result без изменения структуры. Повторная доставка события к завершённому заданию
        возвращает 204 и не перезаписывает его. Если ML_CALLBACK_TOKEN не задан в backend, возвращается 503.'
      operationId: receiveAnalysisEvent
      security:
        - InternalBearerAuth: []
      requestBody:
        required: true
        description: Событие от ML-сервиса
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisEvent'
      responses:
        '204':
          description: Событие успешно принято и сохранено
        '400':
          description: Некорректные данные события
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Ошибка авторизации ML-сервиса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Задача анализа не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: ML_CALLBACK_TOKEN не настроен на backend.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/analysis/jobs/{jobID}/chat/messages:
    get:
      tags:
        - Chat
      summary: Получить историю сообщений аналитической сессии
      description: Список сохранённых сообщений одной аналитической сессии, по возрастанию created_at и id. Текущая
        демоверсия не проверяет право пользователя на job_id.
      operationId: getChatMessages
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '200':
          description: История сообщений успешно получена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessagesResponse'
        '400':
          description: Некорректный job_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Аналитическая сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Chat
      summary: Отправить сообщение в чат аналитической сессии
      description: 'Синхронно отправляет сообщение и историю из последних 12 сообщений в ML/Mock для завершённого анализа.
        При успехе сохраняет user и assistant атомарно и возвращает message_id пользователя.
        Ответ assistant доступен через GET истории. Лимит обработки Go ChatService — 120 секунд (если клиент не отменит запрос раньше). При ошибке обмен не сохраняется.
        Одновременный POST для той же сессии возвращает 409. Авторизация пользователя пока отсутствует в демоверсии.'
      operationId: sendChatMessage
      parameters:
        - $ref: '#/components/parameters/JobID'
      requestBody:
        required: true
        description: Сообщение пользователя
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendChatMessageRequest'
            example:
              content: Как можно снизить финансовые риски компании?
      responses:
        '400':
          description: Некорректное сообщение или job_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Аналитическая сессия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Анализ не готов или другой запрос чата этой сессии ещё выполняется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Ошибка ML или некорректный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: ML-чат не настроен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Превышено время обработки сообщения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Сообщения пользователя и ML сохранены; message_id указывает на сообщение пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendChatMessageResponse'
  /api/v1/analysis/jobs/{jobID}/chat/events:
    get:
      tags:
        - Chat
      summary: SSE чата недоступен (заглушка HTTP 503)
      description: Резервный endpoint возвращает HTTP 503. MVP использует синхронный POST сообщений и GET истории;
        стриминг чата не реализован.
      operationId: streamChatEvents
      parameters:
        - $ref: '#/components/parameters/JobID'
      responses:
        '503':
          description: Стриминг чата не используется.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-implementation-status: not-implemented
components:
  securitySchemes:
    InternalBearerAuth:
      type: http
      scheme: bearer
      description: Секрет ML_CALLBACK_TOKEN для внутренних запросов ML → Go (не ML_SERVICE_TOKEN).
  parameters:
    JobID:
      name: jobID
      in: path
      required: true
      description: Уникальный идентификатор задачи анализа
      schema:
        type: string
        format: uuid
  schemas:
    RoleCode:
      type: string
      description: Роль для персонализации аналитики ML.
      enum:
        - accountant
        - ceo
        - cfo
        - decision_maker
        - other_c_level
        - owner
        - treasurer
    AnalysisStatus:
