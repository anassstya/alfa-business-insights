openapi: 3.0.3

info:
  title: Alfa Business Insights API
  version: 1.0.0
  
servers:
  - url: http://localhost:8080
    description: Local Go backend

paths:
  /api/v1/roles:
    get:
      tags:
        - Roles
      summary: Получить список ролей
      description: Возвращает все доступные роли для персонализации аналитики.
      operationId: getRoles

      responses:
        '200':
          description: Список ролей успешно получен
          content:
            application/json:
              schema:
                type: object
                required:
                  - roles
                properties:
                  roles:
                    type: array
                    items:
                      type: object
                      required:
                        - code
                        - full_name
                      properties:
                        code:
                          type: string
                          example: cfo
                        full_name:
                          type: string
                          example: Финансовый директор
              example:
                roles:
                  - code: ceo
                    full_name: Генеральный директор
                  - code: cfo
                    full_name: Финансовый директор

  /api/v1/companies:
    get:
      summary: Получить список компаний

      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20

        - name: offset
          in: query
          schema:
            type: integer
            default: 0

        - name: city
          in: query
          schema:
            type: string

        - name: region
          in: query
          schema:
            type: string

        - name: industry
          in: query
          schema:
            type: string

      responses:
        '200':
          description: Список компаний
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        synthetic_u:
                          type: string
                        industry_name:
                          type: string
                        city:
                          type: string
                        region:
                          type: string
                  total:
                    type: integer

  /api/v1/companies/{id}:
    get:
      summary: Получить подробную информацию о компании

      parameters:
        - name: id
          in: path
          required: true
          description: Уникальный ID записи компании
          schema:
            type: integer
            format: int64

      responses:
        '200':
          description: Информация о компании
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  synthetic_u:
                    type: string
                  org_type:
                    type: string
                  industry_code:
                    type: string
                  industry_name:
                    type: string
                  company_age_years_gradation:
                    type: string
                  amount_workers_fns_gradation:
                    type: string
                  revenue_company:
                    type: number
                  city:
                    type: string
                  region:
                    type: string
                  cl_type:
                    type: string

        '404':
          description: Компания не найдена
