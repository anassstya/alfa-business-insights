    StartAnalysisRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        demo_user_id:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: Для проверки связи компании с выбранным демопользователем. Если не указан, связь не проверяется.
        role:
          $ref: '#/components/schemas/RoleCode'
        goal:
          type: string
          maxLength: 1000
          nullable: true
          description: Необязательная цель анализа.
      example:
        demo_user_id: 1
        role: cfo
        goal: Оценить риски финансирования
    StartAnalysisResponse:
      type: object
      additionalProperties: false
      required:
        - job_id
      properties:
        job_id:
          type: string
          format: uuid
          description: ID созданного задания анализа.
      example:
        job_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    AnalysisJobSummary:
      type: object
      required:
        - job_id
        - company_id
        - role
        - goal
        - status
        - stage
        - created_at
      properties:
        job_id:
          type: string
          format: uuid
        company_id:
          type: integer
          format: int64
          minimum: 1
          description: Числовой companies.id, не synthetic_u.
        role:
          $ref: '#/components/schemas/RoleCode'
        goal:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        stage:
          type: string
          nullable: true
          enum: [loading_profile, mapping_exposures, planning, retrieving, analyzing, validating, completed, null]
        created_at:
          type: string
          format: date-time
    AnalysisJob:
      allOf:
        - $ref: '#/components/schemas/AnalysisJobSummary'
        - type: object
          required:
            - demo_user_id
            - result
            - error_message
            - updated_at
          properties:
            demo_user_id:
              type: integer
              format: int64
              nullable: true
            result:
              type: object
              nullable: true
              allOf:
                - $ref: '#/components/schemas/AnalysisResult'
            error_message:
              type: string
              nullable: true
            updated_at:
              type: string
              format: date-time
      description: Состояние задания и полный сохранённый результат. Result равен null до финального callback.
    AnalysisEvent:
      type: object
      additionalProperties: false
      required:
        - job_id
        - status
      properties:
        job_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AnalysisCallbackStatus'
        stage:
          type: string
          nullable: true
          enum: [loading_profile, mapping_exposures, planning, retrieving, analyzing, validating, completed, null]
        result:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AnalysisResult'
        error_message:
          type: string
          nullable: true
      description: Callback от ML. Промежуточные события не содержат result; финальные могут содержать полный AnalysisResult.
        Тело запроса не более 1 MiB.
      example:
        job_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        status: running
        stage: retrieving
    ChatMessage:
      type: object
      required:
