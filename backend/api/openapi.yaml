
openapi: 3.0.3

info:
  title: Alfa Business Insights API
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local Go backend

paths:
  /api/v1/roles:
    get:
      tags:
        - Roles
      summary: Получить список ролей
      description: Возвращает все доступные роли для персонализации аналитики
      operationId: getRoles

      responses:
        '200':
          description: Список ролей успешно получен
          content:
            application/json:
              schema:
                type: object
                required:
                  - roles
                properties:
                  roles:
                    type: array
                    items:
                      type: object
                      required:
                        - code
                        - full_name
                      properties:
                        code:
                          type: string
                          example: cfo
                        full_name:
                          type: string
                          example: Финансовый директор
              example:
                roles:
                  - code: ceo
                    full_name: Генеральный директор
                  - code: cfo
                    full_name: Финансовый директор

  /api/v1/demo/users:
    get:
      tags:
        - Demo Users
      summary: Получить список демопользователей
      description: Возвращает список тестовых пользователей для выбора профиля при входе в приложение
      operationId: getDemoUsers

      responses:
        '200':
          description: Список демопользователей успешно получен
          content:
            application/json:
              schema:
                type: object
                required:
                  - users
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - synthetic_f
                        - first_name
                        - last_name
                      properties:
                        id:
                          type: integer
                          format: int64
                          example: 1
                        synthetic_f:
                          type: string
                          example: F_25503
                        first_name:
                          type: string
                          example: Александр
                        last_name:
                          type: string
                          example: Иванов
              example:
                users:
                  - id: 1
                    synthetic_f: F_25503
                    first_name: Александр
                    last_name: Иванов
                  - id: 2
                    synthetic_f: F_93095
                    first_name: Мария
                    last_name: Петрова
                  - id: 3
                    synthetic_f: F_11036
                    first_name: Дмитрий
                    last_name: Сидоров
