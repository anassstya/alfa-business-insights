services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # VITE_* встраиваются в бандл при сборке, поэтому передаём их как build args (значения — из корневого .env)
      args:
        VITE_API_URL: ${VITE_API_URL:?API_URL_REQUIRED}
    container_name: frontend
    ports:
      - "3000:3000"
    networks:
      - hack_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL_is_required}
      ML_MODE: ${ML_MODE:-http}
      ML_HTTP_TIMEOUT: ${ML_HTTP_TIMEOUT:-8m}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml:8000}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:-}
      ML_CALLBACK_TOKEN: ${ML_CALLBACK_TOKEN:-}
    networks:
      - hack_network


networks:
  hack_network:
    driver: bridge
