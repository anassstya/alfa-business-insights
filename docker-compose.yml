services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080
    networks:
      - hack_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL_is_required}
    networks:
      - hack_network

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: ml
    ports:
      - "8000:8000"
    volumes:
      - ml_data:/app/data
      - model_cache:/models/huggingface
    networks:
      - hack_network

volumes:
  ml_data:
  model_cache:

networks:
  hack_network:
    driver: bridge
